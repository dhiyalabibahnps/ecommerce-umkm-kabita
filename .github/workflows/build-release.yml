name: Auto Build (Release)

on:
  push:
    branches:
      - 'release/**'
      - 'release/v0.0.1'
      - 'main'
  pull_request:
    branches:
      - 'release/**'
      - 'release/v0.0.1'
      - 'main'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, pdo_mysql, bcmath, curl, zip
          coverage: none

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install & Configure Backend (Laravel)
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=mariadb/DB_CONNECTION=sqlite/' .env || true
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --class=KabitaFullDataSeeder --force

      - name: Run Backend Feature & Unit Tests
        working-directory: backend
        run: php artisan test

      - name: Install & Configure Frontend (Vue 3)
        working-directory: frontend
        run: |
          npm install
          cp .env.example .env

      - name: Auto Build Frontend
        working-directory: frontend
        run: npm run build
